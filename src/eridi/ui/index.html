<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Eridi</title>
  <link rel="stylesheet" href="/ui/app.css">
  <script src="/ui/app.js" defer></script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="top">
    <a class="brand" href="#/search">Eridi</a>
    <nav aria-label="Main">
      <a href="#/search" data-nav="search">Search</a>
      <a href="#/activity" data-nav="activity">Activity</a>
      <a href="#/changes" data-nav="changes">Changes <span class="badge" id="pending-count" hidden></span></a>
      <a href="#/storage" data-nav="storage">Storage</a>
    </nav>
    <div class="scan">
      <span id="scan-status" role="status" aria-live="polite"></span>
      <button type="button" id="scan-now">Scan now</button>
    </div>
  </header>
  <div class="layout">
    <aside class="sidebar" aria-labelledby="projects-heading">
      <h2 id="projects-heading">Projects</h2>
      <ul id="project-list"></ul>
      <form id="new-project" class="new-project">
        <label for="new-project-name" class="visually-hidden">New project</label>
        <input id="new-project-name" name="name" placeholder="New project" autocomplete="off" required>
        <button type="submit" class="secondary">Add</button>
      </form>
      <p id="new-project-error" class="error" role="alert" hidden></p>
    </aside>
    <main id="main" tabindex="-1"></main>
  </div>
</body>
</html>
