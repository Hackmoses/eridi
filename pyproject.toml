[project]
name = "eridi"
version = "0.0.1"
description = "Local-first research memory: find your lab's files, see what changed, and record why."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Eridi contributors" }]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "fastapi>=0.115",
    "google-auth-oauthlib>=1.2",
    "httpx>=0.28",
    "keyring>=25",
    "mcp>=2.3",           # official MCP SDK, so AI assistants can use the record
    "msal>=1.31",
    "openpyxl>=3.1",      # .xlsx text
    "pathspec>=0.12",     # gitignore-style patterns for .eridiignore
    "platformdirs>=4.2",  # correct per-OS app-data locations
    "pypdfium2>=4.30",    # .pdf text via PDFium (fast, prebuilt for macOS, Windows, Linux)
    "python-docx>=1.2",   # .docx text and comments
    "python-pptx>=1.0",   # .pptx text
    "python-ulid>=3.0",   # sortable IDs that are unique across devices
    "rich>=13.7",         # readable terminal output (tables, colors); Typer already uses it
    "tomli-w>=1.0",       # writes config.toml (the standard library only reads TOML)
    "typer>=0.12",        # command line
    "uvicorn>=0.31",
    "watchdog>=4.0",      # live file watching (macOS FSEvents, Windows ReadDirectoryChangesW, inotify)
]

[project.scripts]
eridi = "eridi.cli.main:app"

[dependency-groups]
dev = [
    "httpx>=0.27",
    "mypy>=1.11",
    "playwright>=1.48",
    "pre-commit>=3.8",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.17",
    "types-openpyxl>=3.1",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eridi"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.format]
exclude = ["*.md"]  # docs show illustrative code; keep their hand layout

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PTH", "N", "S"]
ignore = ["RUF001", "RUF002", "RUF003"]  # allow non-ASCII text in strings and comments

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # assert is how pytest works

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["pypdfium2", "pypdfium2.*"]  # ships no type information
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["msal", "msal.*"]  # ships no type information
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["google_auth_oauthlib", "google_auth_oauthlib.*"]  # ships no type information
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "perf: performance tests (skip with -m 'not perf')",
    "browser: drives the web UI in Chromium (Linux CI only)",
]
filterwarnings = [
    # watchdog's inotify backend warns when a folder is created while it adds a recursive watch
    "ignore:Callback with id:RuntimeWarning",
]
