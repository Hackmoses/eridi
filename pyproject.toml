[project]
name = "eridi"
version = "0.0.1"
description = "Local-first research memory: find your lab's files, see what changed, and record why."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Eridi contributors" }]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "platformdirs>=4.2",  # correct per-OS app-data locations
    "python-ulid>=3.0",   # sortable IDs that are unique across devices
    "typer>=0.12",        # command line
]

[project.scripts]
eridi = "eridi.cli.main:app"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "openpyxl>=3.1",      # builds the sample lab fixture (runtime dependency from M2)
    "pre-commit>=3.8",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "python-docx>=1.1",   # builds the sample lab fixture (runtime dependency from M2)
    "ruff>=0.17",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eridi"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.format]
exclude = ["*.md"]  # docs show illustrative code; keep their hand layout

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PTH", "N", "S"]
ignore = ["RUF001", "RUF002", "RUF003"]  # allow non-ASCII text in strings and comments

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # assert is how pytest works

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["perf: performance tests (skip with -m 'not perf')"]
